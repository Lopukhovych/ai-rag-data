[project]
name = "ai-rag-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Volodymyr Lopukhovych", email = "volodymyr.l@btigroup.io" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "datasketch>=2.0.0",
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
]

[project.scripts]
ai-rag-data = "ai_rag_data:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
