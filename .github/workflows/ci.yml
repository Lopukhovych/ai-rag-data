name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the required status check in branch protection: keep it "build".
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version-bump check compares with the base commit and tags

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The EnterpriseRAG-Bench download is about 1.4 GB; cache it per pinned revision.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('sources.yaml') }}

      - run: uv sync --frozen

      - name: Lint and unit tests
        run: |
          uv run ruff check .
          uv run pytest -q

      - name: Build the mini profile
        run: uv run python build.py --profile mini

      # Schemas, MANIFEST hashes and pinned revisions, tenant and split leakage,
      # permissions, hand-written asset minimums.
      - name: Validate
        run: uv run python validate.py

      # Once a release exists, derived files may only change together with a dataset_version bump.
      - name: Derived files changed without a dataset_version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git tag -l 'v*' | grep -q .; then
            echo "No release tag yet; skipping the version-bump check."
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA:build.py" 2>/dev/null; then
            echo "Base commit has no build.py; skipping."
            exit 0
          fi
          git worktree add ../base "$BASE_SHA"
          (cd ../base && uv sync --frozen && uv run python build.py --profile mini --out "$RUNNER_TEMP/base-build")
          python3 - <<'PY'
          import json, os, sys
          new = json.load(open("build/MANIFEST.json"))
          old = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "base-build", "MANIFEST.json")))
          changed = sorted(k for k in set(new["files"]) | set(old["files"])
                           if new["files"].get(k) != old["files"].get(k))
          if changed and new["dataset_version"] == old["dataset_version"]:
              print(f"{len(changed)} derived files changed but dataset_version is still {new['dataset_version']}:")
              print("\n".join(changed[:20]))
              sys.exit(1)
          print("OK:", "no derived changes" if not changed else f"version bumped to {new['dataset_version']}")
          PY
